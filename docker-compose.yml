services:
# ------------------------------------------------------------------------- POSTGRES
  postgres:
    image: postgres:14
    container_name: ${PROJECT_NAME}-postgres
    ports:
      - "5432:5432"
    env_file: .env
    healthcheck:
      test: >
        pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} &&
        psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c "SELECT 1;" -q
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1G
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10M"
        max-file: "3" 
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    networks:
      - rtainer 

# ----------------------------------------------------------------------------- BACKUP

  backup:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME}-backup
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./volumes/backups:/backups
    entrypoint: >
      sh -c "while true; do
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB |
        gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
        find /backups -mtime +7 -print;
        find /backups -mtime +7 -delete;
        sleep 86400;
      done"
    restart: unless-stopped
    mem_limit: 512M 
    deploy:
      resources:
        limits:
          memory: 512M 
        reservations:
          memory: 128M 
    logging:
      driver: json-file
      options:
        max-size: "10M"
        max-file: "3" 
    networks: 
      - rtainer 


# ---------------------------------------------------------------------------- DEV
  api:
    build:
      context: .
      dockerfile: ./docker/server/Dockerfile.dev
    image: konsin1988/${PROJECT_NAME}-dev:${PROJECT_VERSION}
    container_name: ${PROJECT_NAME}-dev 
    env_file: .env
    ports:
      - "${CONTAINER_PORT}:8013"
    volumes:
      - ./api:/app
      - /app/tmp
    command: air /app
    profiles:
      - dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512M 
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10M"
        max-file: "3" 
    networks:
      - rtainer 

# ----------------------------------------------------------------------------- PROD
  api-prod:
    build:
      context: .
      dockerfile: ./docker/server/Dockerfile
    image: konsin1988/${PROJECT_NAME}:${PROJECT_VERSION}
    container_name: ${PROJECT_NAME} 
    env_file: .env
    ports:
      - "${CONTAINER_PORT}:8013"
    profiles:
      - prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512M 
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10M"
        max-file: "3" 
    networks:
      - rtainer

networks:
  rtainer:
    name: rtainer 
    external: True
