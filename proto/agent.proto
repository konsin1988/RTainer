syntax = "proto3";

package agent;

import "google/protobuf/struct.proto";

option go_package = "/agent/proto";

service ImageService{
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc InspectImage(ImageRequest) returns (InspectImageResponse);
  rpc PullImage(PullImageRequest) returns (stream PullImageMessage);
  //rpc PushImage(...)
  //rpc BuildImage(...)
  //rpc TagImage(...)
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);
  //rpc PruneImage(...)
}

service ContainerService{
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc InspectContainer(ContainerRequest) returns (ContainerResponse);
  rpc CreateContainer(RunContainerRequest) returns (ContainerResponse);
  rpc StartContainer(ContainerRequest) returns (ContainerResponse);
  rpc StopContainer(ContainerRequest) returns (ContainerResponse);
  rpc RestartContainer(ContainerRequest) returns (ContainerResponse);
  rpc KillContainer(KillContainerRequest) returns (ContainerResponse);
  rpc PauseContainer(ContainerRequest) returns (ContainerResponse);
  rpc UnpauseContainer(ContainerRequest) returns (ContainerResponse);
  rpc RemoveContainer(RemoveContainerRequest) returns (ContainerResponse);
  rpc UpdateContainer(UpdateContainerRequest) returns (ContainerResponse);
  rpc RenameContainer(RenameContainerRequest) returns (ContainerResponse);
  rpc ExecContainer(ExecuteCommandRequest) returns (stream LogMessage);
  rpc LogsContainer(ViewLogsRequest) returns (stream LogMessage);
  rpc StatsContainer(ContainerRequest) returns (stream ContainerStatsResponse);
}

service NetworkService {
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  rpc InspectNetwork(NetworkRequest) returns (NetworkResponse);
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc RemoveNetwork(NetworkRequest) returns (NetworkResponse);
  rpc ConnectNetwork(ConnectNetworkRequest) returns (NetworkResponse);
  rpc DisconnectNetwork(DisconnectNetworkRequest) returns (NetworkResponse);
  rpc PruneNetwork(NetworkPruneRequest) returns (NetworkPruneResponse);
}

service VolumeService {
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc InspectVolume(InspectVolumeRequest) returns (InspectVolumeResponse);
  rpc CreateVolume(CreateVolumeRequest) returns (VolumeResponse);
  rpc RemoveVolume(RemoveVolumeRequest) returns (VolumeResponse);
  rpc PruneVolume(PruneVolumeRequest) returns (PruneVolumeResponse);
}

service StackService {
  rpc ListStacks(ListStackRequest) returns (ListStackResponse);
//  rpc Get(...)
//  rpc Deploy(...)
//  rpc Update(...)
//  rpc Stop(...)
//  rpc Start(...)
//  rpc Remove(...)
}
//
//service RegistryService {
//  rpc List(...)
//  rpc Create(...)
//  rpc Update(...)
//  rpc Remove(...)
//  rpc Test(...)
//}
//
//service SystemService {
//  rpc Info(...)
//  rpc Version(...)
//  rpc DiskUsage(...)
//  rpc Prune(...)
//}
//
//service EventService {
//  rpc Events(...)
//}

service AgentService {


  // docker info
  rpc DockerInfo(DockerInfoRequest) returns (DockerInfoResponse);

  // events
  rpc Events(EventsRequest) returns (stream EventMessage);
}

// ------------------------------------ IMAGES 
message ListImagesRequest {}

message Image {
  string id = 1;
  string repo_tags = 2;
  int64 size = 3;
  int64 created = 4;
}

message ListImagesResponse {
  repeated Image images = 1;
}


message RemoveImageRequest {
    string id = 1;
    bool force = 2;
}
message RemoveImageResponse {}


message ImageRequest {
  string id = 1;
}

message InspectImageResponse {
  string id = 1;

  repeated string repo_tags = 2;
  repeated string repo_digests = 3;

  int64 size = 4;
  int64 created = 5;

  string os = 6;
  string architecture = 7;

  repeated string env = 8;
  repeated string cmd = 9;
  repeated string entrypoint = 10;

  map<string, string> labels = 11;

  repeated string exposed_ports = 12;
}

message PullImageRequest {
    string reference = 1; // e.g. "nginx:latest"
}

message PullImageMessage {
    string status = 1;
    string id = 2;

    int64 current = 3;
    int64 total = 4;

    string error = 5;
}

// ------------------------------------------------------------------ CONTAINERS 
message ListContainersRequest {}

message Container {
  string id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
}

message ContainerInfo {
    string id = 1;
    string name = 2;
    string image = 3;
    string status = 4;

    repeated PortBinding ports = 5;
    repeated VolumeBinding mounts = 6;
    repeated string env = 7;

    HealthStatus health = 8;
}

message ListContainersResponse {
  repeated Container containers = 1;
}

// ----------------------------------------- STOP, START EXISTING CONTAINER BY ID
message ContainerRequest { string id = 1; }
message ContainerResponse {
    ContainerInfo container = 1;
}

message KillContainerRequest {
    string id = 1;

    // Signal to send, e.g. "SIGKILL", "SIGTERM", "9".
    // If empty, Docker uses SIGKILL.
    string signal = 2;
}


message RemoveContainerRequest {
    string id = 1;
    bool force = 2;
    bool remove_volumes = 3;
}

message RunContainerRequest {
  string image_id = 1;

  string name = 2;
  repeated string command = 3;
  repeated string env = 4;      // ["KEY=value"]
  repeated PortBinding ports = 5;
  repeated VolumeBinding volumes = 6;
  bool tty = 7;
  bool detach = 8;
}

message PortBinding {
  string container_port = 1;
  string host_ip = 2;
  string host_port = 3;
}

message VolumeBinding {
  string source = 1;
  string target = 2;
}

message UpdateContainerRequest {
  string id = 1;

  // Resource limits
  optional int64 cpu_shares = 2;
  optional int64 cpu_period = 3;
  optional int64 cpu_quota = 4;
  optional int64 memory = 5;
  optional int64 memory_swap = 6;
  optional int64 pids_limit = 7;

  // Restart policy
  optional RestartPolicy restart_policy = 8;

  // Storage
  optional int64 blkio_weight = 9;

  // Runtime
  optional int64 cpu_count = 10;
  optional int64 cpu_percent = 11;
}

message RestartPolicy {
  string name = 1;        // no, always, unless-stopped, on-failure
  int64 maximum_retry_count = 2;
}

message RenameContainerRequest{
  string id = 1;
  string name = 2;
}

// -------------------------------------------- VIEW LOGS
message ViewLogsRequest {
  string container_id = 1;

  bool follow = 2;            
  uint32 tail = 3;           
  bool timestamps = 4;
}

enum LogStream {
    LOG_STREAM_UNSPECIFIED = 0;
    STDOUT = 1;
    STDERR = 2;
}

message LogMessage {
    string line = 1;
    LogStream stream = 2;
}

// ------------------------------------------- EXECUTE COMMAND
message ExecuteCommandRequest {
    string id = 1;
    repeated string command = 2;
    bool tty = 3;
}

message HealthStatus {
    string status = 1;
    int32 failing_streak = 2;
    repeated string logs = 3;
}

// --------------------------------------------- CONTAINER STATS
message ContainerStatsResponse {
  double cpu_percent = 1;

  uint64 memory_usage = 2;
  uint64 memory_limit = 3;

  uint64 network_rx = 4;
  uint64 network_tx = 5;

  uint64 block_read = 6;
  uint64 block_write = 7;

  uint32 pids = 8;
}

// --------------------------------------------- NETWORKS
message NetContainer {
  string id = 1;
	string name = 2;
  string ipv4_address = 3; 
}

message NetworkListItem {
  string id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;

  repeated NetContainer containers = 5;
}

message NetworkInfo {
  string id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;

  bool internal = 5;
  bool attachable = 6;
  bool ingress = 7;

  repeated IPAMConfig ipam = 8;

  map<string, string> options = 9;
  map<string, string> labels = 10;

  repeated NetContainer containers = 11;
}


message ListNetworksRequest {}

message ListNetworksResponse {
  repeated NetworkListItem networks = 1;
}

message CreateNetworkRequest {
  string name = 1;

  string driver = 2;       // bridge, overlay, host...
  bool internal = 3;
}

message CreateNetworkResponse {
  string id = 1;
}

message NetworkRequest {
    string id = 1;
}

message NetworkResponse {
    NetworkInfo network = 1;
}

message IPAMConfig {
    string subnet = 1;
    string gateway = 2;
    string ip_range = 3;
}

message ConnectNetworkRequest {
    string network_id = 1;
    string container_id = 2;

    EndpointSettings endpoint = 3;
}

message EndpointSettings {
    string ipv4_address = 1;
    string ipv6_address = 2;
    string mac_address = 3;

    repeated string aliases = 4;
}

message DisconnectNetworkRequest {
    string network_id = 1;
    string container_id = 2;
    
    bool forse = 3;
}

message NetworkPruneRequest {
    map<string, string> filters = 1;
}

message NetworkPruneResponse {
    repeated string deleted_network_ids = 1;
}

// --------------------------------------------------- VOLUMES 
message ListVolumesRequest {}

message Volume {
    string name = 1;
    string driver = 2;
    string mountpoint = 3;

    map<string, string> labels = 4;

    string scope = 5;
}

message ListVolumesResponse {
    repeated Volume volumes = 1;
}

message CreateVolumeRequest {
    string name = 1;
    string driver = 2;

    map<string, string> labels = 3;
    map<string, string> options = 4;
}

message VolumeResponse {}

message RemoveVolumeRequest {
    string name = 1;
    bool force = 2;
}

message InspectVolumeRequest{
    string name = 1;
}

message InspectVolumeResponse{
    VolumeInfo volume = 1;
}

message VolumeInfo{
    string name = 1;
    string driver = 2;
    string mount_point = 3;
    string created_at = 4;
    google.protobuf.Struct status = 5;
    string scope = 6;

    map<string, string> labels = 7;
    map<string, string> options = 8;
}


message PruneVolumeRequest {
    map<string, string> filters = 1;
}

message PruneVolumeResponse {
    repeated string deleted_volume_ids = 1;
}

// ------------------------------------------------ DOCKER INFO
message DockerInfoRequest {}

message DockerInfoResponse {
    string server_version = 1;
    string api_version = 2;

    string operating_system = 3;
    string architecture = 4;
    string kernel_version = 5;

    int32 containers = 6;
    int32 containers_running = 7;
    int32 containers_paused = 8;
    int32 containers_stopped = 9;

    int32 images = 10;
    int32 volumes = 11;

    string driver = 12;

    int64 mem_total = 13;
    int32 ncpu = 14;

    string docker_root_dir = 15;

    string name = 16;
    string id = 17;
}

// ----------------------------------------------- EVENTS
message EventsRequest {
    repeated string types = 1;      // container, image, network, volume...
    repeated string actions = 2;    // create, start, stop...
}

message EventMessage {
    int64 time = 1;

    string type = 2;
    string action = 3;

    string id = 4;

    map<string, string> attributes = 5;
}

// ----------------------------------------------------------------------- STACKS
// LIST
message ListStackRequest {}

message ListStackResponse {
    repeated Stack stacks = 1;
}

message Stack {
    string id = 1;
    string name = 2;
    string status = 3;

    repeated Container containers = 4;
    repeated NetworkListItem networks = 5;
    repeated Volume volumes = 6;
}
